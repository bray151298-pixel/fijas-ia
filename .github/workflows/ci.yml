name: CI

# CI mínima FIJAS IA (PRE-F00): build del servicio desplegable + tests + secret scan.
# No sustituye la auditoría externa; bloquea merges con build roto o secretos filtrados.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-node:
    name: Build & test (Node / app_web = servicio desplegado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install & build app_web (lo que Render compila)
        working-directory: app_web
        run: |
          npm install
          npm run build
      - name: Install root deps
        run: npm install
      - name: TS test suite (core-engine)
        run: npx tsx run_tests.ts

  secret-scan:
    name: Secret scan (FAIL CLOSED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escanear secretos y credenciales hardcodeadas
        shell: bash
        run: |
          set -e
          PATTERNS='AIza[0-9A-Za-z_-]{35}|[0-9]{8,10}:[A-Za-z0-9_-]{35}|FijasIA2026\*|FIJAS-ADMIN-ROOT-2026'
          # Excluir dependencias, builds y docs/ejemplos de auditoría.
          if grep -rInE "$PATTERNS" \
              --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
              --exclude-dir=.venv --exclude-dir=.github \
              --exclude='*.md' --exclude='*.example' . ; then
            echo "::error::Secreto/credencial hardcodeada detectada. FAIL CLOSED."
            exit 1
          fi
          echo "OK: no se detectaron secretos hardcodeados."

  python-tests:
    name: Python backend tests (opcional, no bloqueante de deploy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install & pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest || true
          pytest -q || true
