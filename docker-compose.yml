version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set (FAIL CLOSED, sin user por defecto)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (FAIL CLOSED, sin password por defecto)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set (FAIL CLOSED)}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  omniroute:
    image: diegosouzapw/omniroute:latest
    ports:
      - "20128:20128"
    volumes:
      - omniroute_data:/app/data
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OMNIROUTE_BASE_URL: http://omniroute:20128/v1
    env_file:
      - .env
    depends_on:
      - db
      - omniroute
    ports:
      - "8000:8000"
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  retrainer:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OMNIROUTE_BASE_URL: http://omniroute:20128/v1
    env_file:
      - .env
    depends_on:
      - db
      - omniroute
    command: ["python", "-m", "backend.app.ml.retrain_scheduler"]

volumes:
  pgdata:
  omniroute_data:
